name: Release

# Builds installers for Windows, macOS, and Linux and attaches them all to
# one GitHub Release whenever a version tag (e.g. v1.2.0) is pushed.
#
# Multibox, the Combat Overlay, and the Price Widget are native Win32/GDI
# overlays with no cross-platform equivalent yet - they compile out to
# harmless no-ops on macOS/Linux (see src-tauri/src/multibox.rs and the
# #[cfg(not(windows))] stubs in src-tauri/src/commands.rs) rather than
# blocking the rest of the app from building there.
#
# The macOS build targets the runner's native architecture (Apple Silicon
# on macos-latest) rather than a universal binary - Intel Mac support can
# be added later via `--target universal-apple-darwin` if needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - name: Install frontend dependencies
        run: npm ci

      # A manual workflow_dispatch run (e.g. to sanity-check a macOS/Linux
      # build) has no version tag - github.ref_name would just be the
      # branch name, and passing that as tagName would create a real draft
      # release/tag named after the branch. Only pass a tagName on an
      # actual "v*" tag push; a manual run just builds, with no release
      # created at all.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "VESPER ${{ github.ref_name }}"
          releaseBody: "See the commit history for what's changed."
          releaseDraft: true
          prerelease: false
