[package]
name = "tauri-app"
version = "1.9.8"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# `tauri dev` shells out to plain `cargo run` (no --bin flag), which only
# auto-resolves when exactly one binary target exists. A second bin under
# src/bin/ (e.g. a one-off debug probe) makes that ambiguous and `cargo run`
# refuses to guess - this pins the default explicitly so extra bin targets
# never break the dev workflow again.
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
keyring = "4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
dotenvy = "0.15"
open = "5"
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
aes-gcm = "0.11.0"
dirs = "6.0.0"
quick-xml = { version = "0.36", features = ["serialize"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls"] }

# Multibox's Linux implementation: pure-protocol X11 (no libX11/libxcb
# system dependency) for window enumeration, XComposite-based capture, and
# EWMH focus requests.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["composite"] }
jpeg-encoder = "0.6"

# Multibox's macOS implementation: CGWindowListCopyWindowInfo/
# CGWindowListCreateImage (hand-declared externs against the CoreGraphics
# framework, in multibox_macos.rs) for enumeration/capture, plus
# core-foundation for the CFArray/CFDictionary results they return.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
jpeg-encoder = "0.6"

